name: JOSS draft PDF

# Renders paper/paper.md with the JOSS toolchain. The PDF is uploaded as a
# workflow artifact, not committed.
on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      # Name the PDF after the manuscript and the date of the commit it was
      # built from, e.g. Sleep_Scoring_App_JOSS_Manuscript_2026-10-15.pdf.
      - name: Name PDF
        id: name
        run: |
          name="Sleep_Scoring_App_JOSS_Manuscript_$(git log -1 --format=%cd --date=format:%Y-%m-%d)"
          mv paper/paper.pdf "paper/${name}.pdf"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: paper/${{ steps.name.outputs.name }}.pdf
