[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep_scoring"
dynamic = ["version"]
description = "Sleep scoring application with deep learning support"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "dash==3.3.0",
    "dash-bootstrap-components==2.0.4",
    "dash-extensions==2.0.4",
    "dash-player==1.1.0",
    "Flask-Caching==2.3.1",
    "plotly>=6.5.0",
    "plotly-resampler==0.11.0",
    "scipy==1.16.3",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.9",
    "pywebview==6.1",
    "imageio-ffmpeg==0.6.0",
    "tqdm==4.67.1",
    "desktop-app-source-updater @ git+https://github.com/yzhaoinuw/desktop_app_source_updater.git@main",
]

[project.optional-dependencies]
ml = [
    "torch==2.9.1",
    "timm==1.0.22",
    "einops==0.8.1",
]
dev = [
    "black==26.5.1",
    "pre-commit==4.5.1",
    # Release preflight parses CITATION.cff. Declared in dev and test rather
    # than in the runtime dependencies so it stays out of the packaged Windows
    # app. It must be in both: the release gates need it, and the packaging
    # tests import those gates. CI installs the two extras in separate jobs,
    # so keep the pins identical.
    "pyyaml==6.0.3",
]
test = [
    "pytest==9.1.1",
    #"pytest-cov",
    "pyyaml==6.0.3",  # see the note in dev; the packaging tests import the release gates
]

[tool.setuptools.dynamic]
version = {attr = "app_src.__init__.VERSION"}

[tool.setuptools.packages.find]
include = ["app_src*", "models*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "ml: marks tests requiring PyTorch",
]
